spring.application.name=julens-server

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/julens_db?serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:julens}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:veryveryveryveryverysecretkeyforjwt1234567890}
jwt.expiration=${JWT_EXPIRATION:3600000}

springdoc.swagger-ui.path=/swagger-ui.html