spring.application.name=julens-server
spring.profiles.default=mock

server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/julens_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:julens}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:dev-only-secret-key-dev-only-secret-key-123456}
jwt.expiration=${JWT_EXPIRATION:3600000}

springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
lens.analysis.scheduling-enabled=${LENS_ANALYSIS_SCHEDULING_ENABLED:true}
lens.analysis.schedule-cron=${LENS_ANALYSIS_SCHEDULE_CRON:0 */5 * * * MON-FRI}
