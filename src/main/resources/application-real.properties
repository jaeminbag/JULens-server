finnhub.api-key=${FINNHUB_API_KEY}
finnhub.base-url=${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
finnhub.news-lookback-days=${FINNHUB_NEWS_LOOKBACK_DAYS:7}
finnhub.min-request-interval-millis=${FINNHUB_MIN_REQUEST_INTERVAL_MILLIS:1100}

# 10초 이상 커넥션을 점유한 실제 장기 작업만 추적한다.
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_THRESHOLD_MS:10000}
# REST/SSE 응답 수명과 JPA 영속성 컨텍스트 수명을 분리한다.
spring.jpa.open-in-view=false

alpaca.api-key-id=${ALPACA_API_KEY_ID}
alpaca.secret-key=${ALPACA_SECRET_KEY}
alpaca.base-url=${ALPACA_BASE_URL:https://data.alpaca.markets/v2}
alpaca.screener-base-url=${ALPACA_SCREENER_BASE_URL:https://data.alpaca.markets/v1beta1/screener}
alpaca.data-delay-minutes=${ALPACA_DATA_DELAY_MINUTES:16}
alpaca.iex-stream-url=${ALPACA_IEX_STREAM_URL:wss://stream.data.alpaca.markets/v2/iex}
alpaca.overnight-poll-millis=${ALPACA_OVERNIGHT_POLL_MILLIS:5000}

# API 키가 필요 없는 Frankfurter 일일 원/달러 기준환율 API
exchange-rate.base-url=${EXCHANGE_RATE_BASE_URL:https://api.frankfurter.dev/v2}

stock.sync.enabled=${STOCK_SYNC_ENABLED:true}
stock.sync.on-startup=${STOCK_SYNC_ON_STARTUP:true}
stock.sync.schedule-cron=${STOCK_SYNC_SCHEDULE_CRON:0 55 3 * * *}
stock.sync.minimum-symbol-count=${STOCK_SYNC_MINIMUM_SYMBOL_COUNT:1000}
lens.analysis.candidate-count=${LENS_ANALYSIS_CANDIDATE_COUNT:100}
