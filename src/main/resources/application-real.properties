finnhub.api-key=${FINNHUB_API_KEY}
finnhub.base-url=${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
finnhub.news-lookback-days=${FINNHUB_NEWS_LOOKBACK_DAYS:7}
finnhub.min-request-interval-millis=${FINNHUB_MIN_REQUEST_INTERVAL_MILLIS:1100}

alpaca.api-key-id=${ALPACA_API_KEY_ID}
alpaca.secret-key=${ALPACA_SECRET_KEY}
alpaca.base-url=${ALPACA_BASE_URL:https://data.alpaca.markets/v2}
alpaca.data-delay-minutes=${ALPACA_DATA_DELAY_MINUTES:16}

stock.sync.enabled=${STOCK_SYNC_ENABLED:true}
stock.sync.on-startup=${STOCK_SYNC_ON_STARTUP:true}
stock.sync.schedule-cron=${STOCK_SYNC_SCHEDULE_CRON:0 55 3 * * *}
stock.sync.max-active-stocks=${STOCK_SYNC_MAX_ACTIVE_STOCKS:100}
